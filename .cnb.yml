# CNB (cnb.cool) 流水线配置
# 用国内 IP 检测友链（GitHub Actions 海外 IP 会被部分站点屏蔽）
# 检测结果通过 vercel CLI 部署到 Vercel 托管

main:
  # 每次推送代码：触发一次状态检测 + 部署
  push:
    - name: 检测友链状态
      imports:
        - https://cnb.cool/qwc-ch/my-secrets/-/blob/main/envs.yml
      env:
        SOURCE_URL: https://blog.amamo.top/api/friends.json
        AUTHOR_URL: blog.amamo.top
        IMG_UPLOAD_URL: https://tu.520781.xyz/upload
        IMG_UPLOAD_FOLDER: screenshot
      stages:
        - name: 检测 + 增量截图
          image: python:3.12
          script: |
            sed -i 's|deb.debian.org|mirrors.cloud.tencent.com|g' /etc/apt/sources.list.d/debian.sources
            apt-get update -qq
            apt-get install -y -qq chromium chromium-driver fonts-wqy-microhei fonts-wqy-zenhei
            pip install -q -r requirements.txt -i https://mirrors.cloud.tencent.com/pypi/simple
            curl -sL --max-time 20 -o result.json "https://check.520781.xyz/result.json" || echo "{}" > result.json
            python main.py
            curl -sL --max-time 20 -o friends.latest.json "$SOURCE_URL"
            DETECTED=$(python friends_watcher.py compare --current friends.latest.json --historical result.json 2>/dev/null || true)
            if [ -n "$DETECTED" ]; then
              echo "检测到变更: $DETECTED"
              TARGET_LINK="$DETECTED" python screenshot_runner.py
            else
              echo "无友链变更，跳过增量截图"
            fi
        - name: 部署到 Vercel
          image: node:22
          script: |
            cp -f result.json static/
            cd static
            npx -y vercel@57 deploy --prod --yes --token "$VERCEL_TOKEN" --name check-flink

  # 每天 2 次：仅状态检测（轻量）
  "crontab: 0 1,13 * * *":
    - name: 检测友链状态
      imports:
        - https://cnb.cool/qwc-ch/my-secrets/-/blob/main/envs.yml
      env:
        SOURCE_URL: https://blog.amamo.top/api/friends.json
        AUTHOR_URL: blog.amamo.top
        IMG_UPLOAD_URL: https://tu.520781.xyz/upload
        IMG_UPLOAD_FOLDER: screenshot
      stages:
        - name: 检测
          image: python:3.12
          script: |
            pip install -q -r requirements.txt -i https://mirrors.cloud.tencent.com/pypi/simple
            curl -sL --max-time 20 -o result.json "https://check.520781.xyz/result.json" || echo "{}" > result.json
            python main.py
        - name: 部署到 Vercel
          image: node:22
          script: |
            cp -f result.json static/
            cd static
            npx -y vercel@57 deploy --prod --yes --token "$VERCEL_TOKEN" --name check-flink

  # 每 6 天：状态检测 + 截图（Selenium + Chrome）
  "crontab: 30 1 1,7,13,19,25 * *":
    - name: 友链状态检测 + 主页截图
      imports:
        - https://cnb.cool/qwc-ch/my-secrets/-/blob/main/envs.yml
      env:
        SOURCE_URL: https://blog.amamo.top/api/friends.json
        AUTHOR_URL: blog.amamo.top
        IMG_UPLOAD_URL: https://tu.520781.xyz/upload
        IMG_UPLOAD_FOLDER: screenshot
        CHROME_BIN: /usr/bin/chromium
        CHROME_DRIVER_PATH: /usr/bin/chromedriver
      stages:
        - name: 检测 + 截图
          image: python:3.12
          script: |
            sed -i 's|deb.debian.org|mirrors.cloud.tencent.com|g' /etc/apt/sources.list.d/debian.sources
            apt-get update -qq
            apt-get install -y -qq chromium chromium-driver fonts-wqy-microhei fonts-wqy-zenhei
            pip install -q -r requirements.txt -i https://mirrors.cloud.tencent.com/pypi/simple
            curl -sL --max-time 20 -o result.json "https://check.520781.xyz/result.json" || echo "{}" > result.json
            python main.py
            python screenshot_runner.py
        - name: 部署到 Vercel
          image: node:22
          script: |
            cp -f result.json static/
            cd static
            npx -y vercel@57 deploy --prod --yes --token "$VERCEL_TOKEN" --name check-flink
